workflows:
  ios-distribution:
    name: Kinto Care iOS
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        BUNDLE_ID: com.kintocare.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: v22.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod init
          pod install
      - name: Initialize keychain
        script: keychain initialize
      - name: Create signing certificate
        script: |
          openssl genrsa -out /tmp/key.pem 2048
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create \
            --private-key /tmp/key.pem
      - name: Add certificate to keychain
        script: keychain add-certificates
      - name: Apply signing profile
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true